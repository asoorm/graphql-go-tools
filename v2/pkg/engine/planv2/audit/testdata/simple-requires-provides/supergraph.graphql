type Query {
  me: User
  products: [Product]
}

type User {
  id: ID!
  name: String
  username: String
  reviews: [Review]
}

type Product {
  upc: String!
  weight: Int
  price: Int
  inStock: Boolean
  shippingEstimate: Int
  shippingEstimateTag: String
  name: String
  reviews: [Review]
}

type Review {
  id: ID!
  body: String
  author: User
  product: Product
}
