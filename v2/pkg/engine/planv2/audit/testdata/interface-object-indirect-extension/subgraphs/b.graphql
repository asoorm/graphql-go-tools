extend schema
      @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key"])

    type Query {
      author: Author
    }

    type Author @key(fields: "id") {
      id: ID!
      name: String
    }

    extend type Video @key(fields: "id") {
      id: ID!
      authorName: String
    }
