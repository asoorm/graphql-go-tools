extend schema
      @link(
        url: "https://specs.apollo.dev/federation/v2.3"
        import: ["@key", "@interfaceObject"]
      )

    type Query {
      playlist: Playlist
    }

    type Playlist @key(fields: "id") {
      id: ID!
      name: String
      media: Media
    }

    type Media @key(fields: "id") @interfaceObject {
      id: ID!
    }
